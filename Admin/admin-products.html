<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin-products.css">
    <title>Manage Products - DigitalStore Admin</title>
    <style>
        * { font-family: 'Roboto', sans-serif; }
    </style>
</head>
<body>
    <nav>
        <span class="logo">DigitalStore</span>
        <ul>
            <li><a href="admin-dashboard.html">Dashboard</a></li>
            <li><a href="admin-products.html" class="active">Products</a></li>
            <li><a href="admin-orders.html">Orders</a></li>
            <li><a href="admin-users.html">Users</a></li>
            <li><a href="#" class="logout-link" onclick="logout()">Logout</a></li>
        </ul>
    </nav>

    <div class="admin-content">
        <div class="header">
            <h1>Manage Products</h1>
            <button class="btn-add" onclick="openAddProductModal()">Add New Product</button>
        </div>

        <div class="filters">
            <input type="text" id="search-input" placeholder="Search products..." onkeyup="renderProducts()">
            <select id="category-filter" onchange="renderProducts()">
                <option value="">All Categories</option>
                <option value="phone">Mobile Phones</option>
                <option value="laptop">Laptops</option>
                <option value="tablet">Tablets</option>
                <option value="accessories">Accessories</option>
            </select>
        </div>

        <table class="products-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Brand</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="products-tbody"></tbody>
        </table>
    </div>

    <div id="product-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modal-title">Add Product</h2>
            <p style="color: #7f8c8d; margin-bottom: 20px; font-size: 0.9rem;">Each product includes fields like name, brand, price, category, specs, quantity, and images.</p>
            <form id="product-form">
                <input type="hidden" id="product-id">
                <div class="form-row">
                    <div class="form-group">
                        <label>Name *</label>
                        <input type="text" id="product-name" placeholder="e.g. iPhone 15 Pro" required>
                    </div>
                    <div class="form-group">
                        <label>Brand *</label>
                        <input type="text" id="product-brand" placeholder="e.g. Apple" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Category *</label>
                        <select id="product-category" required>
                            <option value="">Select Category</option>
                            <option value="phone">Mobile Phones</option>
                            <option value="laptop">Laptops</option>
                            <option value="tablet">Tablets</option>
                            <option value="accessories">Accessories</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Price ($) *</label>
                        <input type="number" id="product-price" step="0.01" min="0" placeholder="0.00" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Specs *</label>
                    <textarea id="product-specs" rows="3" placeholder="e.g. 256GB, A17 Pro chip, 6.1-inch display" required></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Quantity *</label>
                        <input type="number" id="product-quantity" min="0" placeholder="0" required>
                    </div>
                    <div class="form-group">
                        <label>Image URL</label>
                        <input type="text" id="product-image" placeholder="e.g. ../img/logo.png">
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn-save">Save Product</button>
                </div>
            </form>
        </div>
    </div>

    <script src="data-manager.js"></script>
    <script src="admin-products.js"></script>
</body>
</html>
