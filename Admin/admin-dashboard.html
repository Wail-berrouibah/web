<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin-dashboard.css">
    <title>Admin Dashboard - DigitalStore</title>
    <style>
        * { font-family: 'Roboto', sans-serif; }
    </style>
</head>
<body>
    <nav>
        <span class="logo">DigitalStore</span>
        <ul>
            <li><a href="admin-dashboard.html" class="active">Dashboard</a></li>
            <li><a href="admin-products.html">Products</a></li>
            <li><a href="admin-orders.html">Orders</a></li>
            <li><a href="admin-users.html">Users</a></li>
            <li><a href="#" class="logout-link" onclick="logout()">Logout</a></li>
        </ul>
    </nav>

    <div class="admin-content">
        <h1>Dashboard</h1>
        <p style="color: #7f8c8d; margin-bottom: 30px;">Quick search and filter tools for managing devices.</p>
        
        <div class="search-section">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search devices..." onkeyup="filterDashboard()">
            </div>
            <div class="filter-box">
                <select id="category-filter" onchange="filterDashboard()">
                    <option value="">All Categories</option>
                    <option value="phone">Mobile Phones</option>
                    <option value="laptop">Laptops</option>
                    <option value="tablet">Tablets</option>
                    <option value="accessories">Accessories</option>
                </select>
            </div>
        </div>

        <div class="search-results" id="search-results"></div>

        <div class="stats-section">
            <h2>Overview</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total Products</h3>
                    <p id="total-products">0</p>
                </div>
                <div class="stat-card">
                    <h3>Total Orders</h3>
                    <p id="total-orders">0</p>
                </div>
                <div class="stat-card">
                    <h3>Total Users</h3>
                    <p id="total-users">0</p>
                </div>
            </div>
        </div>
    </div>

    <script src="data-manager.js"></script>
    <script src="admin-dashboard.js"></script>
</body>
</html>
