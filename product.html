<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="product.css">
    <script src="Admin/data-manager.js"></script>
    <title>DigitalStore - Browse All Products</title>
</head>
<body>
    <nav>
        <span class="logo">DigitalStore</span>
        <ul>
            <li class="link"><a href="index.html">Home</a></li>
            <li class="link"><a href="product.html">Products</a></li>
            <li class="link"><a href="cart.html">Shopping Cart</a></li>
            <li class="link"><a href="checkout.html">Checkout</a></li>
            <li class="link"><a href="Admin/admin-login.html" class="admin-btn">Admin</a></li>
        </ul>
    </nav>

    <div class="container shop-layout">
        <aside class="sidebar">
            <h3>Filters</h3>
            <div class="filter-group">
                <h4>Category</h4>
                <label><input type="checkbox" value="phone" onchange="filterProducts()"> Mobile Phones</label>
                <label><input type="checkbox" value="laptop" onchange="filterProducts()"> Laptops</label>
                <label><input type="checkbox" value="tablet" onchange="filterProducts()"> Tablets</label>
                <label><input type="checkbox" value="accessories" onchange="filterProducts()"> Accessories</label>
            </div>

            <div class="filter-group">
                <h4>Brand</h4>
                <label><input type="checkbox" value="Apple" onchange="filterProducts()"> Apple</label>
                <label><input type="checkbox" value="Samsung" onchange="filterProducts()"> Samsung</label>
                <label><input type="checkbox" value="Dell" onchange="filterProducts()"> Dell</label>
                <label><input type="checkbox" value="Sony" onchange="filterProducts()"> Sony</label>
                <label><input type="checkbox" value="Google" onchange="filterProducts()"> Google</label>
            </div>

            <div class="filter-group">
                <h4>Price Range</h4>
                <select id="price-filter" onchange="filterProducts()">
                    <option value="all">All Prices</option>
                    <option value="0-500">$0 - $500</option>
                    <option value="501-1000">$501 - $1000</option>
                    <option value="1000+">$1000+</option>
                </select>
            </div>
        </aside>

        <main class="main-shop">
            <div class="shop-header">
                <h2>All Products</h2>
                <div class="sort-options">
                    <label>Sort by:</label>
                    <select id="sort-logic" onchange="sortProducts()">
                        <option value="newest">Newest</option>
                        <option value="low">Price: Low to High</option>
                        <option value="high">Price: High to Low</option>
                        <option value="name">Name A-Z</option>
                    </select>
                </div>
            </div>

            <div class="product-grid" id="product-list"></div>
        </main>
    </div>

    <footer class="site-footer">
        <div class="footer-bottom">
            <p>&copy; 2026 DigitalStore Project. All rights reserved.</p>
        </div>
</footer>
    <script src="js/products.js"></script>
</body>
</html>
