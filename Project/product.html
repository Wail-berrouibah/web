<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="product.css">
    <script src="Admin/data-manager.js"></script>
    <title>DigitalStore - Browse All Products</title>
</head>
<body>
    <nav>
        <span class="logo">DigitalStore</span>
        <ul>
            <li class="link"><a href="index.html">Home</a></li>
            <li class="link"><a href="product.html">Products</a></li>
            <li class="link"><a href="cart.html">Shopping Cart</a></li>
            <li class="link"><a href="checkout.html">Checkout</a></li>
            <li class="link"><a href="Admin/admin-login.html" class="admin-btn">Admin</a></li>
        </ul>
    </nav>

    <div class="container shop-layout">
        <aside class="sidebar">
            <h3>Filters</h3>
            <div class="filter-group">
                <h4>Category</h4>
                <label><input type="checkbox" value="phone" onchange="filterProducts()"> Mobile Phones</label>
                <label><input type="checkbox" value="laptop" onchange="filterProducts()"> Laptops</label>
                <label><input type="checkbox" value="tablet" onchange="filterProducts()"> Tablets</label>
                <label><input type="checkbox" value="accessories" onchange="filterProducts()"> Accessories</label>
            </div>

            <div class="filter-group">
                <h4>Brand</h4>
                <label><input type="checkbox" value="Apple" onchange="filterProducts()"> Apple</label>
                <label><input type="checkbox" value="Samsung" onchange="filterProducts()"> Samsung</label>
                <label><input type="checkbox" value="Dell" onchange="filterProducts()"> Dell</label>
                <label><input type="checkbox" value="Sony" onchange="filterProducts()"> Sony</label>
                <label><input type="checkbox" value="Google" onchange="filterProducts()"> Google</label>
            </div>

            <div class="filter-group">
                <h4>Price Range</h4>
                <select id="price-filter" onchange="filterProducts()">
                    <option value="all">All Prices</option>
                    <option value="0-500">$0 - $500</option>
                    <option value="501-1000">$501 - $1000</option>
                    <option value="1000+">$1000+</option>
                </select>
            </div>
        </aside>

        <main class="main-shop">
            <div class="shop-header">
                <h2>All Products</h2>
                <div class="sort-options">
                    <label>Sort by:</label>
                    <select id="sort-logic" onchange="sortProducts()">
                        <option value="newest">Newest</option>
                        <option value="low">Price: Low to High</option>
                        <option value="high">Price: High to Low</option>
                        <option value="name">Name A-Z</option>
                    </select>
                </div>
            </div>

            <div class="product-grid" id="product-list"></div>
        </main>
    </div>

    <footer class="site-footer">
        <div class="footer-bottom">
            <p>&copy; 2026 DigitalStore Project. All rights reserved.</p>
        </div>
    </footer>

    <script>
        let allProducts = [];

        function loadProducts() {
            allProducts = getProducts();
            renderProductGrid(allProducts);
        }

        function renderProductGrid(products) {
            const container = document.getElementById('product-list');
            if (products.length === 0) {
                container.innerHTML = '<p>No products found.</p>';
                return;
            }
            container.innerHTML = products.map(product => `
                <div class="shop-item">
                    <img src="${product.image || './img/logo.png'}" alt="${product.name}">
                    <h3>${product.name}</h3>
                    <p class="price">$${product.price.toFixed(2)}</p>
                    <a href="details.html?id=${product.id}" class="btn-view">View Details</a>
                </div>
            `).join('');
        }

        function sortProducts() {
            const sortBy = document.getElementById('sort-logic').value;
            let sorted = [...allProducts];
            switch(sortBy) {
                case 'low': sorted.sort((a,b) => a.price - b.price); break;
                case 'high': sorted.sort((a,b) => b.price - a.price); break;
                case 'name': sorted.sort((a,b) => a.name.localeCompare(b.name)); break;
                case 'newest': sorted.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt)); break;
            }
            renderProductGrid(sorted);
        }

        function filterProducts() {
            const categoryCheckboxes = document.querySelectorAll('.filter-group:first-of-type input[type="checkbox"]:checked');
            const categories = [...categoryCheckboxes].map(c => c.value);
            const brandCheckboxes = document.querySelectorAll('.filter-group:nth-of-type(2) input[type="checkbox"]:checked');
            const brands = [...brandCheckboxes].map(c => c.value);
            const priceRange = document.getElementById('price-filter').value;

            let filtered = allProducts.filter(p => {
                const catMatch = categories.length === 0 || categories.includes(p.category);
                const brandMatch = brands.length === 0 || brands.some(b => p.brand.toLowerCase().includes(b.toLowerCase()));

                let priceMatch = true;
                if (priceRange !== 'all') {
                    if (priceRange === '0-500') priceMatch = p.price <= 500;
                    else if (priceRange === '501-1000') priceMatch = p.price > 500 && p.price <= 1000;
                    else if (priceRange === '1000+') priceMatch = p.price > 1000;
                }

                return catMatch && brandMatch && priceMatch;
            });

            renderProductGrid(filtered);
        }

        document.addEventListener('DOMContentLoaded', loadProducts);
    </script>
</body>
</html>
