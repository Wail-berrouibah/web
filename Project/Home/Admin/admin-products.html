<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="admin-products.css">
    <title>Manage Products - DigitalStore Admin</title>
</head>
<body>
    <nav class="admin-nav">
        <span class="logo">DigitalStore Admin</span>
        <ul>
            <li><a href="admin-dashboard.html">Dashboard</a></li>
            <li><a href="admin-products.html" class="active">Products</a></li>
            <li><a href="admin-orders.html">Orders</a></li>
            <li><a href="admin-users.html">Users</a></li>
            <li><a href="#" onclick="logout()">Logout</a></li>
        </ul>
    </nav>

    <div class="admin-content">
        <div class="header">
            <h1>Manage Products</h1>
            <button class="btn-add" onclick="openAddProductModal()">Add New Product</button>
        </div>

        <div class="filters">
            <input type="text" id="search-input" placeholder="Search products..." onkeyup="renderProducts()">
            <select id="category-filter" onchange="renderProducts()">
                <option value="">All Categories</option>
                <option value="phone">Mobile Phones</option>
                <option value="laptop">Laptops</option>
                <option value="tablet">Tablets</option>
                <option value="accessories">Accessories</option>
            </select>
        </div>

        <table class="products-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Brand</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="products-tbody"></tbody>
        </table>
    </div>

    <div id="product-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modal-title">Add Product</h2>
            <form id="product-form">
                <input type="hidden" id="product-id">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="product-name" required>
                </div>
                <div class="form-group">
                    <label>Brand</label>
                    <input type="text" id="product-brand" required>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="product-category" required>
                        <option value="phone">Mobile Phones</option>
                        <option value="laptop">Laptops</option>
                        <option value="tablet">Tablets</option>
                        <option value="accessories">Accessories</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Price</label>
                    <input type="number" id="product-price" step="0.01" required>
                </div>
                <div class="form-group">
                    <label>Specs</label>
                    <textarea id="product-specs" required></textarea>
                </div>
                <div class="form-group">
                    <label>Quantity</label>
                    <input type="number" id="product-quantity" required>
                </div>
                <button type="submit" class="btn-save">Save Product</button>
            </form>
        </div>
    </div>

    <script src="data-manager.js"></script>
    <script src="admin-products.js"></script>
</body>
</html>
